<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Gráfico de barras publicado, recortado a los doce primeros genes de cuarenta, con una ruptura marcada en el eje y la escala conservada abajo. Los genes van ordenados por el logaritmo del cambio entre treinta y siete grados y seis grados: FOS encabeza la lista, seguido de CXCL2, ZFP36, FOSB, DUSP1, ATF3, CXCL8, NR4A1, CXCL3, PPP1R15A, JUNB y EGR1. Al lado se explica que son veintitrés mil setecientas treinta y una células de xenoinjertos de mama, con colagenasa a treinta y siete grados frente a proteasa fría a seis, y que aunque no es riñón, ni ratón, ni la misma enzima, salen los mismos genes. Al pie, la atribución: O'Flanagan y colaboradores 2019, Genome Biology veinte, doscientos diez, figura tres a, con licencia CC BY 4.0.">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .cap { font-size:24px; font-weight:600; fill:#5A6373; }
      .cre { font-size:24px; font-weight:600; fill:#8A93A8; }
    </style>
  </defs>

  <text class="t eti" x="20" y="34">Los mismos genes, en tumor humano</text>
  <image x="20" y="46" width="334" height="330" href="data:image/png;base64,"/>
  <text class="t cap" x="388" y="92">23 731 células de xenoinjertos de mama.</text>
  <text class="t cap" x="388" y="126">Colagenasa a 37 °C frente a proteasa fría a 6 °C.</text>
  <text class="t eti" x="388" y="178" style="fill:#2B3FA8">No es riñón. No es ratón.</text>
  <text class="t eti" x="388" y="216" style="fill:#2B3FA8">No es la misma enzima.</text>
  <text class="t eti" x="388" y="254" style="fill:#A01B2B">Y salen los mismos genes.</text>
  <text class="t cap" x="388" y="316">FOS encabeza otra vez. JUNB, EGR1 y</text>
  <text class="t cap" x="388" y="350">HSPA1A están en la lista; JUN, algo más abajo.</text>
  <text class="t cre" x="20" y="380">O’Flanagan et al. 2019, Genome Biology 20:210, fig. 3a · CC BY 4.0</text>
  <text class="t cre" x="20" y="410">12 de 40 genes, con la ruptura marcada</text>
</svg>
