<text class="t chico" x="900" y="159">solo el primero sigue</text>
<circle cx="34" cy="212" r="16" fill="#000977"/>
<text class="t dentro" x="34" y="219" text-anchor="middle">3</text>
<text class="t eti" x="60" y="219">Se repara y se liga el adaptador</text>
<rect x="20" y="230" width="120" height="28" rx="7" fill="#5A6373"/>
