<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Cuatro filas apiladas que muestran cómo cambia la misma molécula. Fila uno, lo que sale de la gota: sitio de lectura uno, código de barras, UMI, poli-dT y a continuación un cDNA largo que termina en el TSO. Fila dos, se fragmenta: el cDNA aparece cortado en tres trozos separados por marcas de corte, y un corchete señala que solo sigue adelante el trozo que conserva el código de barras. Fila tres, se repara y se liga: ese trozo, ahora más corto, lleva pegado en su extremo derecho el sitio de la lectura dos. Fila cuatro, la PCR de índice: la misma molécula gana P5 por la izquierda y el índice i7 más P7 por la derecha. Al pie, la clave de colores y el aviso de que el código de barras y el UMI entraron en la gota y llegan intactos hasta el final.">
<defs><style>.t{font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif;fill:#141A4A;}.eti{font-size:24px;font-weight:700;}.nota{font-size:24px;font-weight:600;}.chico{font-size:24px;font-weight:600;fill:#5A6373;}.dentro{font-size:24px;font-weight:700;fill:#ffffff;}</style><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6373"/></marker></defs>
