<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Resuelto: dos cuentas en la célula A y una en la célula B">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .cap { font-size:24px; font-weight:600; fill:#5A6373; }
      .seq { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:24px; font-weight:700; fill:#ffffff; }
      .num { font-size:24px; font-weight:700; fill:#5A6373; }
      .cif { font-size:44px; font-weight:800; }
    </style>
  </defs>

  <path d="M116,50 h-16 v148 h16" fill="none" stroke="#000977" stroke-width="3"/>
  <text class="t eti" x="90" y="116" text-anchor="end" fill="#000977">célula A</text>
  <path d="M116,242 h-16 v40 h16" fill="none" stroke="#000977" stroke-width="3"/>
  <text class="t eti" x="90" y="270" text-anchor="end" fill="#000977">célula B</text>

  <text class="t num" x="138" y="78">1</text>
  <rect x="170" y="52" width="230" height="34" rx="8" fill="#000977"/><text class="seq" x="285" y="77" text-anchor="middle">AAACCTGA</text>
  <rect x="410" y="52" width="140" height="34" rx="8" fill="#2E9AA6"/><text class="seq" x="480" y="77" text-anchor="middle">TTGCA</text>

  <text class="t num" x="138" y="142">2</text>
  <rect x="170" y="116" width="230" height="34" rx="8" fill="#000977"/><text class="seq" x="285" y="141" text-anchor="middle">AAACCTGA</text>
  <rect x="410" y="116" width="140" height="34" rx="8" fill="#2E9AA6"/><text class="seq" x="480" y="141" text-anchor="middle">GATCC</text>

  <text class="t num" x="138" y="206">3</text>
  <rect x="170" y="180" width="230" height="34" rx="8" fill="#000977" opacity="0.32"/><text class="seq" x="285" y="205" text-anchor="middle">AAACCTGA</text>
  <rect x="410" y="180" width="140" height="34" rx="8" fill="#2E9AA6" opacity="0.32"/><text class="seq" x="480" y="205" text-anchor="middle">GATCC</text>
  <line x1="160" y1="197" x2="562" y2="197" stroke="#A01B2B" stroke-width="3"/>
  <text class="t cap" x="576" y="205" fill="#A01B2B">copia de PCR de la 2</text>

  <text class="t num" x="138" y="270">4</text>
  <rect x="170" y="244" width="230" height="34" rx="8" fill="#000977"/><text class="seq" x="285" y="269" text-anchor="middle">GGTCAACG</text>
  <rect x="410" y="244" width="140" height="34" rx="8" fill="#2E9AA6"/><text class="seq" x="480" y="269" text-anchor="middle">TTGCA</text>
  <text class="t cap" x="576" y="269" fill="#1F7A3D">mismo UMI que la 1, pero otra célula: cuenta</text>

  <rect x="880" y="44" width="250" height="106" rx="12" fill="#E7E9F7" stroke="#2B3FA8" stroke-width="2"/>
  <text class="t cap" x="1005" y="80"  text-anchor="middle">célula A</text>
  <text class="t cif" x="1005" y="132" text-anchor="middle" fill="#000977">2</text>

  <rect x="880" y="170" width="250" height="106" rx="12" fill="#E7E9F7" stroke="#2B3FA8" stroke-width="2"/>
  <text class="t cap" x="1005" y="206" text-anchor="middle">célula B</text>
  <text class="t cif" x="1005" y="258" text-anchor="middle" fill="#000977">1</text>

  <line x1="40" y1="312" x2="1140" y2="312" stroke="#DDD8C6" stroke-width="2"/>
  <text class="t eti" x="40" y="354" fill="#141A4A">Cuatro lecturas · tres moléculas · dos células</text>
  <text class="t cap" x="40" y="394">Se colapsa por la terna código + gen + UMI. Por UMI solo, la 4 se borraría.</text>
</svg>
