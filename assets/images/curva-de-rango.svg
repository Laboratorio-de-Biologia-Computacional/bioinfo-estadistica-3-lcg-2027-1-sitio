<text class="t neg" x="707" y="412" text-anchor="middle" fill="#937E00">cola · gotas vacías</text>
<text class="t neg" x="854" y="90" fill="#2E9AA6">Tras el codo hay otra meseta</text>
<text class="t via" x="854" y="112" fill="#5A6373">La curva no se desploma: se</text>
<text class="t via" x="854" y="130" fill="#5A6373">aplana a la altura del RNA</text>
<text class="t via" x="854" y="148" fill="#5A6373">ambiental. Esas gotas tienen</text>
<text class="t via" x="854" y="166" fill="#5A6373">pocas cuentas, pero tienen.</text>
<path d="M 854 168 L 1104 168" fill="none" stroke="#C9D2E8" stroke-width="1.5"/>
<path d="M 854 194 L 888 194" fill="none" stroke="#838A96" stroke-width="2.6" stroke-dasharray="9 6"/>
<text class="t neg" x="898" y="199" fill="#6A7381">codo difuso</text>
<text class="t via" x="854" y="222" fill="#5A6373">Células y ambiente no se</text>
<text class="t via" x="854" y="240" fill="#5A6373">separan. No hay altura</text>
<text class="t via" x="854" y="258" fill="#5A6373">donde trazar la línea, y</text>
<text class="t via" x="854" y="276" fill="#5A6373">eso se ve antes de aplicar</text>
<text class="t via" x="854" y="294" fill="#5A6373">ningún método.</text>
