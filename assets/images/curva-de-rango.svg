<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Curva de rango de codigos de barras en ejes logaritmicos. La curva continua tiene tres tramos: una meseta de celulas a la izquierda, un codo nitido, y a la derecha una cola larga de gotas vacias que se asienta a la altura del RNA ambiental. Una segunda curva punteada muestra el mismo experimento con un codo difuso, donde celulas y ambiente no se separan. Dos lineas horizontales marcan las alturas candidatas: el codo y el punto de inflexion.">
