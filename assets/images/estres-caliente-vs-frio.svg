<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Seis genes ordenados por cuánto más se expresan cuando el tejido se disocia en caliente frente a en frío, en escala logarítmica. Fos encabeza con cincuenta y cuatro veces, seguido de Hspa1a con dieciocho, Egr1 con catorce, Jun con cinco coma seis, Junb con cuatro coma dos y Hsp90aa1 con solo una coma tres. Los de respuesta temprana van en azul y los de choque térmico en oro, y se ve que las dos familias se mezclan en el orden. Al pie, que los datos son de GSE141115, riñón de ratón, seis muestras.">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .cap { font-size:24px; font-weight:600; fill:#5A6373; }
      .cif { font-size:24px; font-weight:700; }
      .avi { font-size:24px; font-weight:700; fill:#A01B2B; }
    </style>
  </defs>

  <text class="t eti" x="30" y="44">Expresión media, disociación en caliente frente a frío</text>
  <text class="t cap" x="30" y="76">cada barra es cuántas veces más se expresa el gen a 37 °C</text>
  <line x1="300" y1="100" x2="300" y2="352" stroke="#C3C8D4" stroke-width="2" stroke-dasharray="5 6"/>
  <text class="t cap" x="300" y="378" text-anchor="middle">1×</text>
  <line x1="727" y1="100" x2="727" y2="352" stroke="#C3C8D4" stroke-width="2" stroke-dasharray="5 6"/>
  <text class="t cap" x="727" y="378" text-anchor="middle">10×</text>
  <text class="t eti" x="286" y="136" text-anchor="end" style="fill:#2B3FA8">Fos</text>
  <rect x="300" y="116" width="740" height="26" rx="6" fill="#2B3FA8"/>
  <text class="t cif" x="1054" y="136" style="fill:#2B3FA8">54×</text>
  <text class="t eti" x="286" y="178" text-anchor="end" style="fill:#937E00">Hspa1a</text>
  <rect x="300" y="158" width="537" height="26" rx="6" fill="#937E00"/>
  <text class="t cif" x="851" y="178" style="fill:#937E00">18×</text>
  <text class="t eti" x="286" y="220" text-anchor="end" style="fill:#2B3FA8">Egr1</text>
  <rect x="300" y="200" width="490" height="26" rx="6" fill="#2B3FA8"/>
  <text class="t cif" x="804" y="220" style="fill:#2B3FA8">14×</text>
  <text class="t eti" x="286" y="262" text-anchor="end" style="fill:#2B3FA8">Jun</text>
  <rect x="300" y="242" width="320" height="26" rx="6" fill="#2B3FA8"/>
  <text class="t cif" x="634" y="262" style="fill:#2B3FA8">5,6×</text>
  <text class="t eti" x="286" y="304" text-anchor="end" style="fill:#2B3FA8">Junb</text>
  <rect x="300" y="284" width="266" height="26" rx="6" fill="#2B3FA8"/>
  <text class="t cif" x="580" y="304" style="fill:#2B3FA8">4,2×</text>
  <text class="t eti" x="286" y="346" text-anchor="end" style="fill:#937E00">Hsp90aa1</text>
  <rect x="300" y="326" width="49" height="26" rx="6" fill="#937E00"/>
  <text class="t cif" x="363" y="346" style="fill:#937E00">1,3×</text>
  <rect x="30" y="396" width="18" height="18" rx="4" fill="#2B3FA8"/>
  <text class="t cap" x="56" y="412">respuesta temprana</text>
  <rect x="330" y="396" width="18" height="18" rx="4" fill="#937E00"/>
  <text class="t cap" x="356" y="412">choque térmico</text>
  <text class="t cap" x="640" y="412">GSE141115 · riñón de ratón · 6 muestras</text>
</svg>
