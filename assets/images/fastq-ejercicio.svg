<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Dos registros de FASTQ sin anotar, para identificar sus partes">
  <!-- Longitudes fieles a lo que declaran las diapositivas: lectura 1 = 28 nt
       (16 de codigo + 12 de UMI) y lectura 2 = 90 nt, que la terminal parte en
       dos renglones de 45 como haria de verdad. Los ultimos 15 son la poli-A. -->
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .mono{ font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:24px; fill:#E8E6E0; }
      .cmd { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:24px; font-weight:700; fill:#F3EFDD; }
      .gris{ fill:#8A93A8; }
    </style>
  </defs>

  <rect x="20" y="12" width="1140" height="176" rx="10" fill="#141A4A"/>
  <text class="cmd"       x="40" y="46">$ zcat muestra_S1_L001_R1_001.fastq.gz | head -4</text>
  <text class="mono gris" x="40" y="80">@A00228:279:HFWFVDMXX:1:1101:2213:1000 1:N:0:ACTGAGCG</text>
  <text class="mono"      x="40" y="112">GTCACGGTCAGTTCCATAGCCTGAATCG</text>
  <text class="mono gris" x="40" y="144">+</text>
  <text class="mono gris" x="40" y="176">FFFFFFFFFFFFFFFFFFFFFFFFFFFF</text>

  <rect x="20" y="200" width="1140" height="140" rx="10" fill="#141A4A"/>
  <text class="cmd"       x="40" y="234">$ zcat muestra_S1_L001_R2_001.fastq.gz | head -2</text>
  <text class="mono gris" x="40" y="266">@A00228:279:HFWFVDMXX:1:1101:2213:1000 2:N:0:ACTGAGCG</text>
  <text class="mono"      x="40" y="298">GGCTGATCAAGGTTCCAGTGACCTTAGGCATGCAAGTCCTGAAGG</text>
  <text class="mono"      x="40" y="330">TCAATGCCTAGGACTTGCATGCCTAAGGTCAAAAAAAAAAAAAAA</text>

  <text class="t eti" x="20"  y="382" fill="#000977">Encuentra tres cosas:</text>
  <text class="t eti" x="20"  y="418" fill="#141A4A">1 · el código de barras</text>
  <text class="t eti" x="440" y="418" fill="#141A4A">2 · el UMI</text>
  <text class="t eti" x="700" y="418" fill="#141A4A">3 · el inserto</text>
</svg>
