<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="A la izquierda, el histograma de valores p de veinte mil genes sin ninguna diferencia real: es plano, y la primera barra reune unos mil genes con p menor que cero punto cero cinco. A la derecha, los valores p ordenados frente a la recta i sobre m por q del procedimiento de Benjamini y Hochberg: se declaran los que quedan por debajo.">
