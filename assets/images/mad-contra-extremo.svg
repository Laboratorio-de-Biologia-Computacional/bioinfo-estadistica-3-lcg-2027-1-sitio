  <path d="M816,236 l14,28" stroke="#5A6373" stroke-width="4" fill="none"/>
  <line x1="834" y1="250" x2="960" y2="250" stroke="#5A6373" stroke-width="3"/>
  <text class="t cap" x="900" y="284" text-anchor="middle">1000</text>
  <circle cx="146" cy="250" r="11" fill="#2B3FA8"/>
  <circle cx="197" cy="250" r="11" fill="#2B3FA8"/>
  <circle cx="197" cy="250" r="11" fill="#2B3FA8"/>
  <circle cx="274" cy="250" r="11" fill="#2B3FA8"/>
  <circle cx="325" cy="250" r="11" fill="#2B3FA8"/>
  <circle cx="376" cy="250" r="11" fill="#2B3FA8"/>
