<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Una recta numérica con la serie uno, tres, tres, seis, ocho, diez, diez y mil. Los siete primeros valores se agrupan a la izquierda, en azul, y el mil queda muy lejos a la derecha, en rojo, tras una ruptura del eje. Encima, una banda gris ancha marca el criterio de tres desviaciones típicas, que va de menos ochocientos cincuenta y seis a mil ciento diecisiete y por tanto no detecta el mil. Debajo, una banda verde estrecha marca el criterio de tres desviaciones absolutas medianas, que va de menos ocho coma seis a veintidós coma seis y sí lo detecta. Al pie, que el ejemplo es de Leys 2013, con media ciento treinta coma uno y desviación típica trescientos veintiocho coma ocho, frente a mediana siete y desviación absoluta mediana escalada cinco coma diecinueve.">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .cap { font-size:24px; font-weight:600; fill:#5A6373; }
      .cif { font-size:24px; font-weight:700; }
      .avi { font-size:24px; font-weight:700; fill:#A01B2B; }
    </style>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6373"/></marker>
  </defs>

  <text class="t eti" x="30" y="46">Por qué un valor extremo no mueve la mediana absoluta</text>
  <text class="t cap" x="30" y="82">serie: 1, 3, 3, 6, 8, 10, 10, 1000</text>
