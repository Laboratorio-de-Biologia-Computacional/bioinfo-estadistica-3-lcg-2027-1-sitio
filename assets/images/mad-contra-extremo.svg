  <text class="t eti" x="90" y="138" style="fill:#5A6373">3 desviaciones típicas: de −856 a 1117</text>
  <text class="t eti" x="750" y="178" style="fill:#A01B2B">no lo detecta</text>
  <rect x="90" y="322" width="608" height="40" rx="10" fill="#1F7A3D" opacity="0.3"/>
  <text class="t eti" x="90" y="312" style="fill:#1F7A3D">3 MAD: de −8,6 a 22,6</text>
  <text class="t eti" x="273" y="350" style="fill:#1F7A3D">sí lo detecta</text>
