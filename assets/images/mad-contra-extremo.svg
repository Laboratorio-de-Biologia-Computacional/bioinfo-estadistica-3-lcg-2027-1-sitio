  <text class="t cap" x="632" y="284" text-anchor="middle">20</text>
  <line x1="760" y1="244" x2="760" y2="256" stroke="#5A6373" stroke-width="3"/>
  <text class="t cap" x="760" y="284" text-anchor="middle">25</text>
