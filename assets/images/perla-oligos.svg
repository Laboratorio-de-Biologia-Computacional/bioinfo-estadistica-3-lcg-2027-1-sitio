<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Estructura del oligo de la perla y el enlace disulfuro que lo sujeta">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .at  { font-size:24px; font-weight:700; fill:#ffffff; }
      .seq { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; font-size:24px; font-weight:700; fill:#ffffff; }
      .ext { font-size:24px; font-weight:700; fill:#5A6373; }
      .nota{ font-size:24px; font-weight:600; fill:#5A6373; }
    </style>
  </defs>

  <!-- ── la perla ── -->
  <path d="M20,66 A130,130 0 0,1 20,326" fill="#000977"/>
  <text class="t eti" x="34" y="204" fill="#ffffff">perla</text>

  <!-- ── el enlace que la sujeta: disulfuro ── -->
  <!-- Los conectores arrancan en x=155: la perla es un semicirculo de radio 130
       centrado en (20,196), asi que su borde llega a x=150 en su punto mas ancho.
       Empezar antes (estaban en x=86) montaba las lineas grises sobre el azul. -->
  <text class="t eti" x="155" y="62" fill="#6E5E00">enlace disulfuro</text>
  <line x1="155" y1="127" x2="178" y2="127" stroke="#5A6373" stroke-width="6"/>
  <circle cx="196" cy="127" r="17" fill="#937E00"/><text class="t at" x="196" y="135" text-anchor="middle">S</text>
  <line x1="213" y1="127" x2="230" y2="127" stroke="#937E00" stroke-width="6"/>
  <circle cx="247" cy="127" r="17" fill="#937E00"/><text class="t at" x="247" y="135" text-anchor="middle">S</text>
  <line x1="264" y1="127" x2="300" y2="127" stroke="#5A6373" stroke-width="6"/>

  <line x1="155" y1="207" x2="300" y2="207" stroke="#5A6373" stroke-width="4" opacity="0.5"/>
  <line x1="155" y1="267" x2="300" y2="267" stroke="#5A6373" stroke-width="4" opacity="0.5"/>

  <!-- ── oligo completo, con sus cinco tramos ── -->
  <text class="t ext" x="296" y="100" text-anchor="end">5′</text>
  <!-- AQUI NO VA P5. El oligo de la perla arranca directamente por el tramo de
       Read 1 parcial, de 22 nt (CTACACGACGCTCTTCCGATCT). P5 no esta en la perla:
       lo anade la PCR de indice de muestra, al final de la construccion de la
       libreria, junto con Read 2, el indice y P7. La figura tenia un P5 dibujado
       que no existe en esta molecula.
       Y no es un cebador: es el SITIO donde se apoya el cebador de la lectura 1
       al secuenciar. Su 3' esta bloqueado por el resto del oligo, asi que no
       puede cebar nada. En la gota el unico cebado lo hace la cola de poli-dT.
       Antes decia "cebador L1"; "L1" ni siquiera es nomenclatura de 10x, es de
       BD Rhapsody, donde L1 y L2 son los enlaces entre CLS1, CLS2 y CLS3. -->
  <text class="t eti" x="435" y="76"  text-anchor="middle" fill="#2B3FA8">Read 1 parcial</text>
  <text class="t eti" x="435" y="100" text-anchor="middle" fill="#2B3FA8">22 nt</text>
  <text class="t eti" x="636" y="76"  text-anchor="middle" fill="#000977">código</text>
  <text class="t eti" x="636" y="100" text-anchor="middle" fill="#000977">de barras</text>
  <text class="t eti" x="747" y="100" text-anchor="middle" fill="#2E9AA6">UMI</text>
  <text class="t eti" x="863" y="100" text-anchor="middle" fill="#937E00">poli-dT</text>

  <rect x="300" y="116" width="270" height="22" rx="11" fill="#2B3FA8"/>
  <rect x="576" y="116" width="120" height="22" rx="11" fill="#000977"/>
  <text class="t seq" x="636" y="134" text-anchor="middle">ACGTACGT</text>
  <rect x="702" y="116" width="90"  height="22" rx="11" fill="#2E9AA6"/>
  <text class="t seq" x="747" y="134" text-anchor="middle">TTGCA</text>
  <rect x="798" y="116" width="130" height="22" rx="11" fill="#937E00"/>
  <text class="t ext" x="940" y="134">3′</text>

  <!-- ── otros dos oligos de la misma perla ── -->
  <rect x="300" y="196" width="270" height="22" rx="11" fill="#2B3FA8"/>
  <rect x="576" y="196" width="120" height="22" rx="11" fill="#000977"/>
  <text class="t seq" x="636" y="214" text-anchor="middle">ACGTACGT</text>
  <rect x="702" y="196" width="90"  height="22" rx="11" fill="#2E9AA6"/>
  <text class="t seq" x="747" y="214" text-anchor="middle">GATCC</text>
  <rect x="798" y="196" width="130" height="22" rx="11" fill="#937E00"/>

  <rect x="300" y="256" width="270" height="22" rx="11" fill="#2B3FA8"/>
  <rect x="576" y="256" width="120" height="22" rx="11" fill="#000977"/>
  <text class="t seq" x="636" y="274" text-anchor="middle">ACGTACGT</text>
  <rect x="702" y="256" width="90"  height="22" rx="11" fill="#2E9AA6"/>
  <text class="t seq" x="747" y="274" text-anchor="middle">CCTAG</text>
  <rect x="798" y="256" width="130" height="22" rx="11" fill="#937E00"/>

  <!-- ── llaves ── -->
  <path d="M576,292 v12 h120 v-12" fill="none" stroke="#000977" stroke-width="3"/>
  <path d="M702,292 v26 h90  v-26" fill="none" stroke="#2E9AA6" stroke-width="3"/>

  <text class="t eti" x="300" y="356" fill="#000977">código de barras: el mismo en los millones de oligos</text>
  <text class="t eti" x="300" y="392" fill="#2E9AA6">UMI: distinto en cada uno</text>

  <text class="t nota" x="960" y="356">16 nt</text>
  <text class="t nota" x="960" y="392">12 nt</text>
</svg>
