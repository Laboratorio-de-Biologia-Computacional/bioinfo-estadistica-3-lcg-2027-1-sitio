  <text class="t det" x="687.2" y="286" text-anchor="middle">30 min, 4 °C</text>
  <path d="M777.3,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(881.5,152)"><path d="M-20,-40 h40 v46 a20,20 0 0 1 -40,0 z" fill="#ffffff" stroke="#2B3FA8" stroke-width="4"/>
  <path d="M-20,4 h40" stroke="#2B3FA8" stroke-width="3" opacity="0.5"/>
  <path d="M-44,-32 a30,30 0 1 0 16,-24" fill="none" stroke="#2B3FA8" stroke-width="5"/>
  <path d="M-30,-64 l6,15 l-15,-1 z" fill="#2B3FA8"/>
  <circle cx="32" cy="-22" r="5" fill="#2B3FA8"/><circle cx="40" cy="-4" r="5" fill="#2B3FA8"/></g>
  <circle cx="881.5" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="881.5" y="52" text-anchor="middle">5</text>
  <text class="t eti" x="881.5" y="248" text-anchor="middle">Lavar</text>
  <text class="t eti" x="881.5" y="278" text-anchor="middle">3–4 veces</text>
  <text class="t det" x="881.5" y="316" text-anchor="middle">paso crítico</text>
  <path d="M971.7,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1075.8,152)"><path d="M-46,-46 h20 v26 a10,10 0 0 1 -20,0 z" fill="#E7E9F7" stroke="#2E9AA6" stroke-width="3"/>
  <path d="M-10,-46 h20 v26 a10,10 0 0 1 -20,0 z" fill="#F3EFDD" stroke="#937E00" stroke-width="3"/>
  <path d="M26,-46 h20 v26 a10,10 0 0 1 -20,0 z" fill="#E7E9F7" stroke="#2B3FA8" stroke-width="3"/>
