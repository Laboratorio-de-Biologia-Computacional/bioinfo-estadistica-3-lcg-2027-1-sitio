  <text class="t eti" x="104.2" y="248" text-anchor="middle">Un tubo</text>
  <text class="t eti" x="104.2" y="278" text-anchor="middle">por muestra</text>
  <text class="t det" x="104.2" y="316" text-anchor="middle">sin juntar aún</text>
  <path d="M194.3,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(298.5,152)"><path d="M-20,-40 h40 v46 a20,20 0 0 1 -40,0 z" fill="#ffffff" stroke="#937E00" stroke-width="4"/>
