  <text class="t num" x="298.5" y="52" text-anchor="middle">2</text>
  <text class="t eti" x="298.5" y="248" text-anchor="middle">Bloquear Fc</text>
  <text class="t det" x="298.5" y="286" text-anchor="middle">10 min, 4 °C</text>
  <path d="M388.7,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(492.8,152)"><path d="M4,-42 h42 v54 a21,21 0 0 1 -42,0 z" fill="#ffffff" stroke="#2B3FA8" stroke-width="4"/>
