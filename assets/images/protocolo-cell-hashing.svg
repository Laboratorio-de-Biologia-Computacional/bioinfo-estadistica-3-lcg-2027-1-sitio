<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Flujo de banco de Cell Hashing en seis pasos. Uno: un tubo por muestra, sin juntar todavía. Dos: bloquear los receptores Fc, diez minutos a cuatro grados. Tres: centrifugar el anticuerpo a catorce mil g para quitar agregados. Cuatro: teñir treinta minutos a cuatro grados. Cinco: lavar tres o cuatro veces, el paso crítico. Seis: contar, juntar las muestras y cargar un solo canal. Aviso: el anticuerpo mal lavado se amplifica igual y sale como fondo en todas las gotas.">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .det { font-size:24px; font-weight:600; fill:#5A6373; }
      .num { font-size:24px; font-weight:700; fill:#ffffff; }
      .avi { font-size:24px; font-weight:700; fill:#A01B2B; }
      .ban { font-size:24px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

