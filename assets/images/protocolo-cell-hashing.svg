  <text class="t num" x="492.8" y="52" text-anchor="middle">3</text>
  <text class="t eti" x="492.8" y="248" text-anchor="middle">Centrifugar</text>
  <text class="t eti" x="492.8" y="278" text-anchor="middle">el anticuerpo</text>
  <text class="t det" x="492.8" y="316" text-anchor="middle">14 000 g</text>
  <path d="M583.0,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
