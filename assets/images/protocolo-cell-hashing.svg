  <path d="M-22,16 h44 v20 a22,22 0 0 1 -44,0 z" fill="#E7E9F7" stroke="#2B3FA8" stroke-width="4"/>
  <circle cx="-9" cy="32" r="6" fill="#2E9AA6"/><circle cx="4" cy="38" r="6" fill="#937E00"/>
  <circle cx="13" cy="28" r="6" fill="#2B3FA8"/></g>
  <circle cx="1075.8" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="1075.8" y="52" text-anchor="middle">6</text>
  <text class="t eti" x="1075.8" y="248" text-anchor="middle">Contar, juntar</text>
  <text class="t eti" x="1075.8" y="278" text-anchor="middle">y cargar</text>
  <text class="t det" x="1075.8" y="316" text-anchor="middle">un solo canal</text>
  <text class="t avi" x="12" y="412">El anticuerpo mal lavado se amplifica igual: sale como fondo en todas las gotas.</text>
</svg>
