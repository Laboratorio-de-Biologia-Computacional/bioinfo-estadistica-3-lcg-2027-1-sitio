  <text class="t num" x="687.2" y="82" text-anchor="middle">4</text>
  <text class="t eti" x="687.2" y="250" text-anchor="middle">BAM y códigos</text>
  <text class="t det" x="687.2" y="288" text-anchor="middle">de Cell Ranger</text>
  <path d="M777.3,160 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(881.5,168) scale(0.85)"><rect x="-50" y="-42" width="100" height="64" rx="6" fill="#E7E9F7" stroke="#2E9AA6" stroke-width="4"/>
