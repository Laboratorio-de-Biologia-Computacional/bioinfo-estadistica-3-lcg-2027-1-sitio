  <path d="M2,-42 q-22,22 0,44 q22,22 0,44" fill="none" stroke="#2E9AA6" stroke-width="5"/>
  <path d="M-24,-24 h22 M-26,0 h24 M-24,24 h22" stroke="#8A93A8" stroke-width="4"/>
  <circle cx="-14" cy="0" r="10" fill="#A01B2B"/></g>
  <circle cx="1075.8" cy="74" r="18" fill="#000977"/>
  <text class="t num" x="1075.8" y="82" text-anchor="middle">6</text>
  <text class="t eti" x="1075.8" y="250" text-anchor="middle">¿Hay</text>
  <text class="t eti" x="1075.8" y="280" text-anchor="middle">genotipos?</text>
  <text class="t det" x="1075.8" y="318" text-anchor="middle">demuxlet/vireo</text>
  <text class="t avi" x="12" y="400">Sin reactivo, sin lavados y sin segunda librería: el trabajo se mudó al cómputo.</text>
