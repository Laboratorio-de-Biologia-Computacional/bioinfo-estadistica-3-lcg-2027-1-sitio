      .eti { font-size:24px; font-weight:700; }
      .det { font-size:24px; font-weight:600; fill:#5A6373; }
      .num { font-size:24px; font-weight:700; fill:#ffffff; }
      .avi { font-size:24px; font-weight:700; fill:#A01B2B; }
      .ban { font-size:24px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

