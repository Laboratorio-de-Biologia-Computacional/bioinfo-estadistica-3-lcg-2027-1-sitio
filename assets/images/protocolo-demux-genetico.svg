<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Flujo del demultiplexado genético, partido en dos mitades. En la mesa, tres pasos: elegir donantes genéticamente distintos, que es una decisión de diseño y no una acción de laboratorio; juntar los tubos, que es todo el multiplexado; y cargar el chip, que produce una sola librería. En la computadora, tres pasos más: partir del BAM y los códigos de barras que da Cell Ranger; contar alelos, que tarda de tres a cinco horas y puede pedir hasta noventa y un gigabytes; y decidir según haya genotipos de referencia o no, con demuxlet o con vireo. Aviso: sin reactivo, sin lavados y sin segunda librería, el trabajo se mudó al cómputo.">
