  <rect x="-26" y="-52" width="52" height="10" rx="4" fill="#937E00"/>
  <circle cx="-8" cy="-4" r="7" fill="#937E00"/><circle cx="9" cy="6" r="7" fill="#937E00"/>
  <circle cx="-2" cy="17" r="7" fill="#937E00"/></g>
  <circle cx="687.2" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="687.2" y="52" text-anchor="middle">4</text>
  <text class="t eti" x="687.2" y="248" text-anchor="middle">Frenar</text>
  <text class="t eti" x="687.2" y="278" text-anchor="middle">con BSA</text>
