  <text class="t num" x="104.2" y="52" text-anchor="middle">1</text>
  <text class="t eti" x="104.2" y="248" text-anchor="middle">Lavar hasta</text>
  <text class="t eti" x="104.2" y="278" text-anchor="middle">quitar el BSA</text>
  <text class="t det" x="104.2" y="316" text-anchor="middle">PBS sin suero</text>
  <path d="M194.3,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(298.5,152)"><circle cx="0" cy="-18" r="11" fill="#937E00"/>
