  <circle cx="32" cy="-22" r="5" fill="#2B3FA8"/><circle cx="40" cy="-4" r="5" fill="#2B3FA8"/></g>
  <circle cx="881.5" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="881.5" y="52" text-anchor="middle">5</text>
  <text class="t eti" x="881.5" y="248" text-anchor="middle">Dos lavados</text>
  <text class="t det" x="881.5" y="286" text-anchor="middle">contar, juntar</text>
  <path d="M971.7,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(1075.8,152)"><rect x="-52" y="-38" width="104" height="58" rx="8" fill="#E7E9F7" stroke="#2B3FA8" stroke-width="4"/>
  <circle cx="-30" cy="-18" r="8" fill="#2B3FA8"/><circle cx="0" cy="-18" r="8" fill="#2B3FA8"/>
  <circle cx="30" cy="-18" r="8" fill="#2B3FA8"/>
  <path d="M-34,2 h68" stroke="#2B3FA8" stroke-width="3"/>
  <circle cx="-16" cy="40" r="12" fill="none" stroke="#937E00" stroke-width="4"/>
  <circle cx="16" cy="40" r="12" fill="none" stroke="#937E00" stroke-width="4"/></g>
  <circle cx="1075.8" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="1075.8" y="52" text-anchor="middle">6</text>
  <text class="t eti" x="1075.8" y="248" text-anchor="middle">Cargar</text>
  <text class="t eti" x="1075.8" y="278" text-anchor="middle">en hielo</text>
  <text class="t det" x="1075.8" y="316" text-anchor="middle">cuanto antes</text>
  <text class="t avi" x="12" y="412">El BSA secuestra el lípido: antes del marcaje estorba, después sirve para frenarlo.</text>
</svg>
