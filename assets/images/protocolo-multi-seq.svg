  <text class="t eti" x="298.5" y="248" text-anchor="middle">Ancla</text>
  <text class="t eti" x="298.5" y="278" text-anchor="middle">y código</text>
  <text class="t det" x="298.5" y="316" text-anchor="middle">5 min en hielo</text>
  <path d="M388.7,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(492.8,152)"><circle cx="0" cy="-18" r="11" fill="#937E00"/>
  <path d="M-5,-8 v36 M5,-8 v36" stroke="#C9B458" stroke-width="5" fill="none"/>
