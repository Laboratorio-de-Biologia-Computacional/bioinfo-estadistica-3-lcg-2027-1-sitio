  <circle cx="492.8" cy="44" r="18" fill="#000977"/>
  <text class="t num" x="492.8" y="52" text-anchor="middle">3</text>
  <text class="t eti" x="492.8" y="248" text-anchor="middle">Co-ancla</text>
  <text class="t det" x="492.8" y="286" text-anchor="middle">5 min más</text>
  <path d="M583.0,144 l14,8 l-14,8" fill="none" stroke="#8A93A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
