<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Flujo de banco de MULTI-seq en seis pasos. Uno: lavar las células hasta quitar todo el suero y la albúmina, en PBS sin proteína. Dos: añadir el ancla lipídica junto con el oligo del código, cinco minutos en hielo. Tres: añadir el co-ancla, cinco minutos más, sin lavar en medio. Cuatro: frenar la reacción con albúmina al uno por ciento en frío. Cinco: dos lavados, contar y juntar. Seis: cargar el chip manteniendo todo en hielo. Aviso: la albúmina secuestra el lípido, así que antes del marcaje estorba y después sirve justamente para frenarlo.">
  <defs>
    <style>
      .t   { font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif; fill:#141A4A; }
      .eti { font-size:24px; font-weight:700; }
      .det { font-size:24px; font-weight:600; fill:#5A6373; }
      .num { font-size:24px; font-weight:700; fill:#ffffff; }
      .avi { font-size:24px; font-weight:700; fill:#A01B2B; }
      .ban { font-size:24px; font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

  <g transform="translate(104.2,152)"><path d="M-20,-40 h40 v46 a20,20 0 0 1 -40,0 z" fill="#ffffff" stroke="#937E00" stroke-width="4"/>
