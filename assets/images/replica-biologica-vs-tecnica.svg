<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Tres columnas comparan que varia en cada tipo de replica y con que n se queda el modelo: dos donantes distintos son n igual a dos; un donante en dos alicuotas es n igual a uno; y muchas celulas de un donante siguen siendo n igual a uno.">
