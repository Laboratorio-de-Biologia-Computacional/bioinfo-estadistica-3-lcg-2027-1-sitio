<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Corregir sin diagnosticar, en tres paneles. Primero, dos tipos celulares bien separados y, dentro de cada uno, los dos lotes ya mezclados: no había efecto de lote. Luego se corrige de todos modos y el método mueve las células. Al final, los dos tipos celulares quedaron más cerca, y se perdió separación biológica, marcado en rojo. Al pie: para darse cuenta, la entropía de mezcla ya era alta antes de corregir; qué hacer, medir primero y no corregir si los lotes ya están mezclados.">
