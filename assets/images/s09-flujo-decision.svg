<rect x="125" y="20" width="505" height="78" rx="12" fill="#F7F8FC" stroke="#00053F" stroke-width="2.2"/>
<text class="t neg" x="145" y="52" fill="#00053F" text-anchor="start">1. ¿Cada lote tiene una sola condición?</text>
<text class="t lab" x="145" y="78" fill="#5A6373" text-anchor="start">tabla de lote contra condición</text>
<rect x="720" y="20" width="440" height="78" rx="12" fill="white" stroke="#B3261E" stroke-width="2.2"/>
<text class="t neg" x="738" y="52" fill="#B3261E" text-anchor="start">No corregir</text>
<text class="t lab" x="738" y="78" fill="#141A4A" text-anchor="start">reportar la limitación y repartir en el siguiente</text>
<line x1="634.0" y1="59.0" x2="714.0" y2="59.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="675" y="49" fill="#141A4A" text-anchor="middle">sí</text>
<line x1="225.0" y1="100.0" x2="225.0" y2="128.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="237" y="122" fill="#141A4A" text-anchor="start">no</text>
<rect x="125" y="132" width="505" height="78" rx="12" fill="#F7F8FC" stroke="#00053F" stroke-width="2.2"/>
<text class="t neg" x="145" y="164" fill="#00053F" text-anchor="start">2. ¿Hay efecto de lote?</text>
<text class="t lab" x="145" y="190" fill="#5A6373" text-anchor="start">mezcla baja y silueta por lote mayor que 0</text>
<rect x="720" y="132" width="440" height="78" rx="12" fill="white" stroke="#00053F" stroke-width="2.2"/>
<text class="t neg" x="738" y="164" fill="#00053F" text-anchor="start">No corregir</text>
<text class="t lab" x="738" y="190" fill="#141A4A" text-anchor="start">el método solo movería células</text>
<line x1="634.0" y1="171.0" x2="714.0" y2="171.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="675" y="161" fill="#141A4A" text-anchor="middle">no</text>
<line x1="225.0" y1="212.0" x2="225.0" y2="240.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="237" y="234" fill="#141A4A" text-anchor="start">sí</text>
<rect x="125" y="244" width="505" height="78" rx="12" fill="#F7F8FC" stroke="#00053F" stroke-width="2.2"/>
<text class="t neg" x="145" y="276" fill="#00053F" text-anchor="start">3. ¿Hay tipos celulares en un solo lote?</text>
<text class="t lab" x="145" y="302" fill="#5A6373" text-anchor="start">tabla de lote contra tipo celular</text>
<rect x="720" y="244" width="440" height="78" rx="12" fill="white" stroke="#141A4A" stroke-width="2.2"/>
<text class="t neg" x="738" y="276" fill="#141A4A" text-anchor="start">Vigilar esa población</text>
<text class="t lab" x="738" y="302" fill="#141A4A" text-anchor="start">revisar después que siga en su grupo</text>
<line x1="634.0" y1="283.0" x2="714.0" y2="283.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="675" y="273" fill="#141A4A" text-anchor="middle">sí</text>
<line x1="225.0" y1="324.0" x2="225.0" y2="352.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="237" y="346" fill="#141A4A" text-anchor="start">en ambos casos</text>
<rect x="125" y="356" width="505" height="78" rx="12" fill="#F7F8FC" stroke="#00053F" stroke-width="2.2"/>
<text class="t neg" x="145" y="388" fill="#00053F" text-anchor="start">4. Corregir con 2 o 3 métodos: ¿alguno sirve?</text>
<text class="t lab" x="145" y="414" fill="#5A6373" text-anchor="start">mezcla sube, silueta por tipo no baja, marcadores intactos</text>
<rect x="720" y="356" width="440" height="78" rx="12" fill="white" stroke="#B3261E" stroke-width="2.2"/>
<text class="t neg" x="738" y="388" fill="#B3261E" text-anchor="start">Ninguno sirve</text>
<text class="t lab" x="738" y="414" fill="#141A4A" text-anchor="start">probar parámetros, o no corregir y reportarlo</text>
<line x1="634.0" y1="395.0" x2="714.0" y2="395.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="675" y="385" fill="#141A4A" text-anchor="middle">no</text>
<line x1="225.0" y1="436.0" x2="225.0" y2="464.0" stroke="#141A4A" stroke-width="2.4" marker-end="url(#punta)"/>
<text class="t neg" x="237" y="458" fill="#141A4A" text-anchor="start">sí</text>
<rect x="125" y="468" width="505" height="78" rx="12" fill="#00053F"/>
<text class="t neg" x="145" y="500" style="fill:white" text-anchor="start">5. Usar lo corregido para agrupar y visualizar</text>
<text class="t lab" x="145" y="526" style="fill:white" text-anchor="start">expresión diferencial: cuentas, con el lote en el modelo</text>
<rect x="720" y="438" width="440" height="108" rx="12" fill="#F7F8FC" stroke="#5A6373" stroke-width="1.6" stroke-dasharray="6 4"/>
<text class="t neg" x="738" y="464" fill="#5A6373" text-anchor="start">Lo menos obvio</text>
<text class="t lab" x="738" y="490" fill="#141A4A" text-anchor="start">· la mezcla no llega a 1 si los lotes no tienen</text>
<text class="t lab" x="748" y="512" fill="#141A4A" text-anchor="start">los mismos tipos: no es un fallo</text>
<text class="t lab" x="738" y="536" fill="#141A4A" text-anchor="start">· el UMAP no decide: deciden las métricas</text>
<text class="t pie" x="590" y="622" fill="#00053F" text-anchor="middle">Los pasos 1 a 3 se contestan ANTES de corregir; el 4, comparando contra el control.</text>
<text class="t pie" x="590" y="648" fill="#00053F" text-anchor="middle">Si un grupo del control desaparece, puede ser sobrecorrección o un artefacto del lote: hay que investigarlo.</text>
</svg>
