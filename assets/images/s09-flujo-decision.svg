<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img" aria-label="Diagrama de flujo para decidir si corregir el efecto de lote, con un dibujo pequeño a la izquierda de cada paso. Paso 1: con la tabla de lote contra condición, si cada lote tiene una sola condición, no se corrige, se reporta la limitación y en el siguiente experimento se reparten las condiciones. Paso 2: si no hay efecto de lote, porque la mezcla ya es alta y la silueta por lote cercana a cero, no se corrige. Paso 3: si hay tipos celulares en un solo lote, se vigila esa población. Paso 4: se corrige con dos o tres métodos y se revisa que la mezcla suba, la silueta por tipo no baje y los marcadores sigan intactos; si ninguno sirve, se prueban parámetros o no se corrige y se reporta. Paso 5: lo corregido se usa para agrupar y visualizar; la expresión diferencial se hace con cuentas y el lote en el modelo. Recuadro de lo menos obvio: la mezcla no llega a uno si los lotes no tienen los mismos tipos, y el UMAP no decide. Al pie: los pasos 1 a 3 se contestan antes de corregir; si un grupo del control desaparece, puede ser sobrecorrección o un artefacto del lote.">
  <style><![CDATA[
    .t   { font-family: Calibri, Inter, sans-serif; fill: #141A4A; }
    .tit { font-size: 22px; font-weight: 700; }
    .lab { font-size: 17px; }
    .neg { font-size: 17px; font-weight: 700; }
    .pie { font-size: 18px; }
  ]]></style>
