<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="fastMNN en tres paneles, con círculos para el tipo A, triángulos para el tipo B y rombos para el tipo C, azul para el lote 1 y naranja para el lote 2. Antes: los tipos A y B están en los dos lotes, con el lote 2 desplazado; el tipo C existe solo en el lote 2. Luego se trazan líneas entre pares de células de lotes distintos que se eligen mutuamente como vecinas; el tipo C no tiene pareja, marcado en rojo. Después: el lote 2 se mueve lo que indican los pares, incluido el tipo C, que queda entre los tipos A y B del lote 1, rodeado en rojo. Al pie: un tipo que solo existe en un lote no tiene con quién formar pares, se mueve como sus vecinas y puede terminar confundido con otro tipo.">
