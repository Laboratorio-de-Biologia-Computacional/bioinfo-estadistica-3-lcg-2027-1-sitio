<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Harmony en tres paneles, con círculos para el tipo A, cuadrados para el tipo B, azul para el lote 1 y oro para el lote 2. Primero agrupa las células sin mirar el lote: dos óvalos, cada uno con células de los dos lotes. Luego mueve cada lote hacia el centro de su grupo, marcado con una equis roja. Después de repetir varias veces, los lotes quedan mezclados. Al pie: trabaja sobre los componentes principales, y si cada grupo contiene un solo lote no encuentra nada que alinear.">
