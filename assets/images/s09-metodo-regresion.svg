<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Regresión del lote en tres paneles, con la expresión de un gen en dos tipos celulares. Antes: el lote 2, en oro, está más alto que el lote 1, en azul, y más en el tipo B que en el A. Luego se resta el promedio de cada lote: el lote 2 baja la misma cantidad en todas sus células. Después: en el tipo A el lote 2 quedó por debajo y en el tipo B por encima. Al pie: funciona si el lote suma lo mismo en todas las células; aquí no era así y queda un resto.">
