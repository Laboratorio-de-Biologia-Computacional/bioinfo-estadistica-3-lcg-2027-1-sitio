<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="scVI en tres paneles, con círculos para el tipo A, triángulos para el tipo B, azul para el lote 1 y naranja para el lote 2. Antes: el lote 2 está desplazado de su mismo tipo en el lote 1. Luego, una red neuronal esquemática: los genes entran, se comprimen en dos nodos llamados z y se vuelven a expandir a genes; el lote, en naranja, entra después de z. En el espacio z, los lotes quedan mezclados. Al pie: la red se entrena para reconstruir las cuentas; como el lote se le da aparte, z no necesita guardarlo, y en z se agrupa y se visualiza.">
