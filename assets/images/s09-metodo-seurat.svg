<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Anclas de Seurat en tres paneles, con círculos para el tipo A, cuadrados para el tipo B, azul para el lote 1 y naranja para el lote 2. Primero se busca un eje común, con análisis de correlación canónica: al proyectar las células sobre ese eje, las del tipo A de los dos lotes caen juntas y las del tipo B también. Luego se trazan anclas entre células parecidas de lotes distintos, con líneas más gruesas para las más confiables, y un ancla roja entre tipos distintos que se descarta. Después, cada célula se mueve según las anclas que tiene cerca y los lotes quedan encimados. Al pie: se parece a fastMNN, pero busca los pares en un espacio común y pondera cada ancla.">
