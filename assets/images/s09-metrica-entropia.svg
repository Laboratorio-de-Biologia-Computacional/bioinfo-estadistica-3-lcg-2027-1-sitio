<text class="t lab" x="370" y="194" fill="#141A4A" text-anchor="start">en el círculo:</text>
<text class="t lab" x="370" y="218" fill="#141A4A" text-anchor="start">8 del lote 1, 0 del lote 2</text>
<text class="t neg" x="370" y="248" fill="#141A4A" text-anchor="start">entropía = 0</text>
<text class="t lab" x="950" y="194" fill="#141A4A" text-anchor="start">en el círculo:</text>
<text class="t lab" x="950" y="218" fill="#141A4A" text-anchor="start">4 del lote 1, 4 del lote 2</text>
<text class="t neg" x="950" y="248" fill="#141A4A" text-anchor="start">entropía = 1 (el máximo)</text>
<text class="t lab" x="300" y="346" fill="#5A6373" text-anchor="middle">el lote 2 existe, pero queda lejos:</text>
<text class="t neg" x="300" y="370" fill="#141A4A" text-anchor="middle">los lotes siguen separados</text>
<text class="t lab" x="880" y="346" fill="#5A6373" text-anchor="middle">los dos lotes ocupan la misma zona:</text>
<text class="t neg" x="880" y="370" fill="#141A4A" text-anchor="middle">los lotes están mezclados</text>
<text class="t pie" x="590" y="416" fill="#00053F" text-anchor="middle">Se cuenta de qué lote son las vecinas de cada célula (aquí, 8) y se promedia en todas las células.</text>
<text class="t pie" x="590" y="442" fill="#00053F" text-anchor="middle">No mira el tipo celular: una mezcla perfecta también puede ser una sobrecorrección.</text>
