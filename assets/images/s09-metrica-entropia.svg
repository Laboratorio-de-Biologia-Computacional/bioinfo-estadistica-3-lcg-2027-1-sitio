<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Entropía de mezcla en dos paneles, con las células de los dos lotes. A la izquierda, las células del lote 1 forman una nube y las del lote 2 otra nube aparte; la célula evaluada está en la nube azul y sus ocho vecinas, dentro de un círculo punteado, son todas del lote 1: entropía cero, los lotes siguen separados. A la derecha, las dos nubes ocupan la misma zona y la célula evaluada tiene cuatro vecinas de cada lote: entropía uno, el máximo, los lotes están mezclados. Al pie: se cuenta de qué lote son las vecinas de cada célula y se promedia; no mira el tipo celular, así que una mezcla perfecta también puede ser una sobrecorrección.">
