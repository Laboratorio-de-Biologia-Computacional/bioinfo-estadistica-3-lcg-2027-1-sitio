<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="kBET en dos paneles. A la izquierda, células del lote 1 y del lote 2 en el espacio: arriba están mezcladas y abajo a la derecha hay un grupo solo del lote 1. Se marcan tres vecindades con círculos punteados: la 1 y la 2 en la zona mezclada y la 3, en rojo, en el grupo de un solo lote. A la derecha, barras de proporción: el total es mitad y mitad; las vecindades 1 y 2 tienen 6 y 4 células de cada lote, una diferencia que el azar explica, y no se rechazan; la vecindad 3 tiene las 10 del lote 1, algo casi imposible por azar, y se rechaza, en rojo. Al pie: se rechaza si la vecindad se aleja del total más de lo que explica el azar; se repite en muchas vecindades y pocas rechazadas significa lotes bien mezclados.">
