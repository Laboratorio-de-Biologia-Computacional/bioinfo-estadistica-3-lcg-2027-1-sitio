<line x1="880.0" y1="194.0" x2="820.0" y2="194.0" stroke="#E8820C" stroke-width="2.4" stroke-dasharray="7 5"/>
<line x1="880.0" y1="194.0" x2="910.0" y2="244.0" stroke="#E8820C" stroke-width="2.4" stroke-dasharray="7 5"/>
<circle cx="820.0" cy="154.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="950.0" cy="234.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="810.0" cy="234.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="920.0" cy="144.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="860.0" cy="249.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="940.0" cy="159.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<circle cx="820.0" cy="194.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<circle cx="910.0" cy="244.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<circle cx="845.0" cy="139.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<circle cx="960.0" cy="199.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<circle cx="880.0" cy="194.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<circle cx="880.0" cy="194.0" r="13" fill="none" stroke="#141A4A" stroke-width="2.6"/>
<text class="t neg" x="850" y="166" fill="#1F5FBF" text-anchor="middle" style="font-size:22px; paint-order:stroke; stroke:white; stroke-width:5px">a</text>
<text class="t neg" x="910" y="168" fill="#E8820C" text-anchor="middle" style="font-size:22px; paint-order:stroke; stroke:white; stroke-width:5px">b</text>
<text class="t lab" x="650" y="296" fill="#141A4A" text-anchor="start">a = 5: las de SU lote están a la misma distancia</text>
<text class="t lab" x="650" y="324" fill="#141A4A" text-anchor="start">b = 5: que las del OTRO lote</text>
<text class="t neg" x="650" y="360" fill="#141A4A" text-anchor="start">silueta = (5 − 5) / 5 = 0</text>
<text class="t pie" x="590" y="416" fill="#00053F" text-anchor="middle">Silueta = (b − a) / máx(a, b). Va de −1 a 1. El círculo negro marca la célula que se evalúa.</text>
<text class="t pie" x="590" y="442" fill="#00053F" text-anchor="middle">Con la etiqueta «lote» se quiere cerca de 0; con «tipo celular», cerca de 1.</text>
<circle cx="60.0" cy="18.0" r="8.5" fill="#1F5FBF" stroke="white" stroke-width="1.5"/>
<text class="t lab" x="74" y="24" fill="#5A6373" text-anchor="start">lote 1</text>
<circle cx="150.0" cy="18.0" r="8.5" fill="#E8820C" stroke="white" stroke-width="1.5"/>
<text class="t lab" x="164" y="24" fill="#5A6373" text-anchor="start">lote 2</text>
</svg>
