<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Qué es un ancla, en dos paneles. A la izquierda, un ancla confiable: una célula del lote 1 y una del lote 2, del mismo tipo, unidas por una línea; se eligen entre sí como vecinas y sus vecindarios también se parecen, así que tiene puntaje alto y se usa para corregir. A la derecha, un ancla dudosa, en rojo: las dos células se eligieron entre sí, pero una es del tipo A y la otra del tipo B y sus vecindarios no se parecen, así que tiene puntaje bajo y se descarta. Al pie: un ancla es un par de células de lotes distintos que se consideran la misma célula; con muchas anclas confiables, Seurat calcula cuánto mover cada lote.">
  <style><![CDATA[
