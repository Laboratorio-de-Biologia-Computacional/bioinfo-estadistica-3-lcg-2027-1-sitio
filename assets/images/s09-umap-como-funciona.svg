<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 456" width="1180" height="456" role="img" aria-label="Tres pasos de un UMAP. Primero, una tabla de células por miles de genes. Segundo, cada célula se conecta con sus vecinas más parecidas y se forman tres grupos. Tercero, los grupos se acomodan en un plano: las vecinas quedan juntas y cada grupo compacto. Al pie: UMAP conserva quién es vecina de quién, no cuánto miden las distancias grandes.">
