<text class="t eti" x="68" y="34">Retrotranscripción</text>
<text class="t nota" x="20" y="62">el código 1 llega con el cebador</text>
<circle cx="40" cy="166" r="19" fill="#000977"/>
<text class="t dentro" x="40" y="174" text-anchor="middle">2</text>
<text class="t eti" x="68" y="166">Ligación</text>
<text class="t nota" x="20" y="194">el código 2 se pega en el otro extremo</text>
<circle cx="40" cy="272" r="19" fill="#000977"/>
<text class="t dentro" x="40" y="280" text-anchor="middle">3</text>
<text class="t eti" x="68" y="272">PCR</text>
<text class="t nota" x="20" y="300">el código 3 y los adaptadores</text>
