<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Tres filas con el estado de la molécula en cada ronda. Fila uno, retrotranscripción: arriba el mRNA en gris con su cola de poli-A en oro; abajo, apareado con esa cola, el cebador de la perla, que lleva poli-dT en oro, el UMI en turquesa y el código de barras número uno en azul. Una flecha marca que la enzima copia hacia la izquierda formando el cDNA. Fila dos, ligación: el cDNA ya sintetizado en azul medio, con el código uno y el UMI a la derecha, y un segundo código azul que se une por ligación en el extremo izquierdo. Fila tres, PCR: la molécula completa, con un tercer código y los adaptadores de Illumina en oro oscuro en los dos extremos. Al pie, la clave de colores y el aviso de que el cebador es oligo-dT en las tres rondas, así que siempre se selecciona RNA con cola de poli-A, también en el núcleo.">
<defs><style>.t{font-family:"Source Sans Pro","Segoe UI",system-ui,sans-serif;fill:#141A4A;}.eti{font-size:24px;font-weight:700;}.nota{font-size:24px;font-weight:600;fill:#5A6373;}.dentro{font-size:24px;font-weight:700;fill:#ffffff;}.ext{font-size:24px;font-weight:700;fill:#5A6373;}</style><marker id="fA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B3FA8"/></marker></defs>
