<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Tres filas, una por ronda. Fila uno, retrotranscripción: ocurre dentro del núcleo, que se dibuja entero, y añade el primer código de barras. Entre filas, la indicación de juntar todo y volver a repartir. Fila dos, ligación: también dentro del núcleo entero, y añade el segundo código. Fila tres, lisis y PCR: aquí el núcleo se dibuja roto, con su contenido suelto, y la PCR añade el tercer código. A la derecha de cada fila se ve la etiqueta creciendo, de un bloque a tres. Cada fila indica noventa y seis pozos con unos mil núcleos en cada uno. Al pie: noventa y seis al cubo son ochocientas ochenta y cuatro mil setecientas treinta y seis casillas para cien mil núcleos, un exceso de ocho coma ocho veces, y una tasa de colisión del cinco coma cuatro por ciento.">
