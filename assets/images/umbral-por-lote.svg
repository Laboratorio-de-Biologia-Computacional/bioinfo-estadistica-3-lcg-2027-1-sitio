<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Dos campanas sobre un eje de cuentas por célula, de cero a seis mil. La de la izquierda, en turquesa, es el lote B, de poca cobertura, centrada en mil. La de la derecha, en azul, es el lote A, de buena cobertura, centrada en cinco mil. Entre las dos hay un valle vacío, y ahí es justo donde cae la mediana global, marcada con una línea roja discontinua en mil quinientos, lejos de todas las células. Dos marcas verdes señalan el umbral propio de cada lote, en quinientos cincuenta y cinco y en cuatro mil sesenta. Una flecha roja sale del eje hacia la izquierda indicando que el umbral global vale menos dos mil doscientos ochenta y uno y ni siquiera cabe en el gráfico. Al pie, que el umbral global no descarta ni una sola célula mientras que por lote se descartan las cuatro malas, y que es un ejemplo con cifras redondas.">
