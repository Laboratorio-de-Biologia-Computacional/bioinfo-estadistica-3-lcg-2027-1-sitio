<text class="t lab" x="404" y="308" text-anchor="middle" fill="#141A4A">Las células de un donante comparten su genotipo, su tratamiento y su lote.</text>
<text class="t neg" x="404" y="330" text-anchor="middle" fill="#6E5E00">Contarlas como réplicas es pseudorreplicación.</text>
